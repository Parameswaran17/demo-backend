# Application stack. Image tags are injected by deploy.sh, e.g.
#   FRONTEND_IMAGE=demo-frontend:ab12cd3 BACKEND_IMAGE=demo-backend:9f8e7d6
name: demo-app

services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    expose:
      - "3000"              # reachable only from other containers on app-net (NOT published to host)
    networks: [app-net]

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"   # the only port exposed on the host
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-net]

networks:
  app-net:
    driver: bridge
